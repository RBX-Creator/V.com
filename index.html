<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V.com</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
</head>
<body>
  <div class="app">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="logo.svg" alt="V" class="logo-img" />
      </div>

      <nav class="nav">
        <a href="#" class="nav-item active">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <span>Explore</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          <span>Notifications</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
          <span>Messages</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
          <span>Lists</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <span>Profile</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
          <span>More</span>
        </a>
      </nav>

      <button class="post-btn">Post</button>

      <div class="user-card">
        <div class="avatar">V</div>
        <div class="user-info">
          <strong>You</strong>
          <span>@you</span>
        </div>
      </div>
    </aside>

    <!-- Main Feed -->
    <main class="feed">
      <header class="feed-header">
        <h1>Home</h1>
      </header>

      <div class="compose">
        <div class="avatar">V</div>
        <div class="compose-body">
          <textarea id="postText" placeholder="What's happening?" rows="3"></textarea>
          <div class="compose-actions">
            <button id="postButton" class="post-btn-small">Post</button>
          </div>
        </div>
      </div>

      <div id="timeline" class="timeline">
        <!-- Posts injected by JS -->
      </div>
    </main>

    <!-- Right Sidebar -->
    <aside class="rightbar">
      <div class="search-box">
        <input type="text" placeholder="Search V" />
      </div>

      <div class="widget">
        <h3>What's happening</h3>
        <div class="trend">
          <span class="trend-cat">Trending</span>
          <strong>#Vcom</strong>
          <span class="trend-count">12.4K posts</span>
        </div>
        <div class="trend">
          <span class="trend-cat">Technology</span>
          <strong>AI</strong>
          <span class="trend-count">89.2K posts</span>
        </div>
        <div class="trend">
          <span class="trend-cat">Trending</span>
          <strong>SpaceX</strong>
          <span class="trend-count">45.1K posts</span>
        </div>
      </div>

      <div class="widget">
        <h3>Who to follow</h3>
        <div class="follow-item">
          <div class="avatar small">E</div>
          <div>
            <strong>Elon Musk</strong>
            <span>@elonmusk</span>
          </div>
          <button class="follow-btn">Follow</button>
        </div>
        <div class="follow-item">
          <div class="avatar small">G</div>
          <div>
            <strong>Grok</strong>
            <span>@grok</span>
          </div>
          <button class="follow-btn">Follow</button>
        </div>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
