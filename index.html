<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V.com</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
</head>
<body>
  <!-- Login / Register Modal -->
  <div id="authModal" class="modal-overlay">
    <div class="modal">
      <h2 id="authTitle">Bei V anmelden</h2>
      <div id="authError" class="modal-error hidden"></div>
      <input type="email" id="authEmail" placeholder="E-Mail" />
      <input type="password" id="authPassword" placeholder="Passwort" />
      <input type="text" id="authName" placeholder="Anzeigename" class="hidden" />
      <button id="authSubmit" class="modal-btn">Anmelden</button>
      <div id="authSwitch" class="modal-switch">Noch kein Konto? Registrieren</div>
    </div>
  </div>

  <div class="app hidden" id="app">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="logo.svg" alt="V" class="logo-img" />
      </div>

      <nav class="nav">
        <div class="nav-item active" data-page="home">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </div>
        <div class="nav-item" data-page="explore">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <span>Explore</span>
        </div>
        <div class="nav-item" data-page="profile">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <span>Profile</span>
        </div>
      </nav>

      <button class="post-btn" id="sidebarPostBtn">Post</button>

      <div class="user-card" id="userCard">
        <div class="avatar" id="sidebarAvatar">V</div>
        <div class="user-info">
          <strong id="sidebarName">User</strong>
          <span id="sidebarHandle">@user</span>
        </div>
      </div>
    </aside>

    <!-- Main Feed -->
    <main class="feed">
      <!-- Home -->
      <div id="page-home">
        <header class="feed-header">
          <h1>Home</h1>
        </header>

        <div class="compose">
          <div class="avatar" id="composeAvatar">V</div>
          <div class="compose-body">
            <textarea id="postText" placeholder="What's happening?" rows="3"></textarea>
            <div class="compose-actions">
              <button id="postButton" class="post-btn-small">Post</button>
            </div>
          </div>
        </div>

        <div id="timeline" class="timeline"></div>
      </div>

      <!-- Explore -->
      <div id="page-explore" class="hidden">
        <header class="feed-header">
          <h1>Explore</h1>
        </header>
        <div class="search-box" style="padding:16px;">
          <input type="text" id="searchInput" placeholder="Search V" />
        </div>
        <div id="searchResults" class="timeline"></div>
      </div>

      <!-- Profile -->
      <div id="page-profile" class="hidden">
        <header class="feed-header">
          <h1>Profile</h1>
        </header>
        <div class="profile-edit">
          <input type="text" id="profileName" placeholder="Anzeigename" />
          <input type="text" id="profileHandle" placeholder="@handle" />
          <textarea id="profileBio" placeholder="Bio" rows="3"></textarea>
          <button id="saveProfile" class="post-btn-small">Speichern</button>
          <button id="logoutBtn" class="post-btn-small" style="background:#f4212e;margin-top:12px;">Abmelden</button>
        </div>
      </div>
    </main>

    <!-- Right Sidebar -->
    <aside class="rightbar">
      <div class="widget">
        <h3>What's happening</h3>
        <div class="trend">
          <span class="trend-cat">Trending</span>
          <strong>#Vcom</strong>
          <span class="trend-count">Live now</span>
        </div>
        <div class="trend">
          <span class="trend-cat">Technology</span>
          <strong>AI</strong>
          <span class="trend-count">Hot</span>
        </div>
      </div>
    </aside>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
